[project]
name = "remote-sandbox-quicksand"
version = "0.1.0"
description = "Remote Sandbox server backed by Quicksand QEMU virtual machines"
readme = "README.md"
authors = [
    { name = "Simon Willison", email = "swillison@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12,<4",
    "cryptography>=45,<48",
    "h11>=0.16,<1",
    # Quicksand's guest agent, virtio-serial bus and 9p mount arguments are
    # relied upon directly, so the VM harness and images are pinned exactly.
    "quick-sandbox==0.12.0",
    "quicksand-core==0.13.0",
    "quicksand-qemu==0.5.12",
    "quicksand-alpine==0.10.0",
]

[project.optional-dependencies]
ubuntu = ["quicksand-ubuntu==0.10.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "websockets>=15", "ruff>=0.12"]

[project.scripts]
remote-sandbox-quicksand = "remote_sandbox_quicksand.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
# Microsoft's Quicksand index serves the platform wheels that contain VM images.
# PyPI's quicksand-ubuntu wheel is an image-less stub.
name = "quicksand"
url = "https://microsoft.github.io/quicksand/simple/"
explicit = true

[tool.uv.sources]
quicksand-ubuntu = { index = "quicksand" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires a real Quicksand VM or running server"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.build-backend]
source-include = ["docs/**", "examples/**", "guest-mux/**", "tests/**", "uv.lock", ".python-version", "PROVENANCE.md"]
wheel-exclude = ["src/remote_sandbox_quicksand/ui/test/**"]
