[project]
name = "remote-sandbox-quicksand"
version = "0.1.0"
description = "Remote Sandbox server backed by Quicksand QEMU virtual machines"
readme = "README.md"
authors = [
    { name = "Simon Willison", email = "swillison@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
remote-sandbox-quicksand = "remote_sandbox_quicksand:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
