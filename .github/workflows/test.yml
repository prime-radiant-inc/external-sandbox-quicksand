name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Fetch the shared client from external-sandbox
        run: git clone --depth 1 https://github.com/prime-radiant-inc/external-sandbox.git "$RUNNER_TEMP/external-sandbox"
      - run: uv run ruff check .
      - name: Python tests
        env:
          EXTERNAL_SANDBOX_CLIENT: ${{ runner.temp }}/external-sandbox/claude-code/external_sandbox_exec.py
        run: uv run pytest -m 'not integration'
      - name: JavaScript tests
        run: node --test tests/test_terminal_js.mjs
